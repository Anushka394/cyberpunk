<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SNAKE - Cyberpunk Edition</title>
    <style>
        /* --- GLOBAL STYLES --- */
        :root {
            --bg-color: #0a0a0a;
            --neon-green: #39ff14;
            --neon-pink: #ff0055;
            --neon-blue: #00f3ff;
            --neon-purple: #b026ff;
            --dark-gray: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #0f0f0f 0%, #000000 100%);
            color: var(--neon-green);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Animated Background Grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.5;
        }

        /* --- INTRO SCREEN --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        .intro-text {
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .glitch-label {
            font-size: 1rem;
            color: var(--neon-blue);
            margin-bottom: 15px;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .glitch-name {
            font-size: 3rem;
            font-weight: bold;
            color: var(--neon-pink);
            text-shadow: 
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 30px var(--neon-pink);
            animation: glitchPulse 2s ease-in-out infinite;
        }

        @keyframes glitchPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* --- MAIN LAYOUT --- */
        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            z-index: 20;
            padding: 20px;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            margin: 0;
            text-shadow: 
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green),
                0 0 30px var(--neon-green);
            font-size: 2.5rem;
            letter-spacing: 8px;
            text-align: center;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green); }
            50% { text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-green), 0 0 60px var(--neon-green); }
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            font-size: 1.3rem;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-green);
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }

        .stats-bar span {
            color: var(--neon-pink);
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #game-wrapper {
            position: relative;
            padding: 5px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
            box-shadow: 
                0 0 30px rgba(57, 255, 20, 0.4),
                0 0 60px rgba(255, 0, 85, 0.2);
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(57, 255, 20, 0.4), 0 0 60px rgba(255, 0, 85, 0.2); }
            50% { box-shadow: 0 0 40px rgba(57, 255, 20, 0.6), 0 0 80px rgba(255, 0, 85, 0.4); }
        }

        canvas {
            background-color: #000;
            display: block;
            border-radius: 5px;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            transition: opacity 0.3s;
            border-radius: 5px;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        #status-text {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-shadow: 
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink);
            text-align: center;
            animation: statusPulse 1.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        button.action-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 3px solid var(--neon-blue);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 10px var(--neon-blue);
            box-shadow: 
                0 0 15px var(--neon-blue),
                inset 0 0 15px rgba(0, 243, 255, 0.1);
            margin-top: 20px;
            transition: all 0.3s;
            border-radius: 5px;
            letter-spacing: 2px;
        }
        
        button.action-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 
                0 0 30px var(--neon-blue),
                0 0 60px var(--neon-blue);
            transform: translateY(-2px);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1px;
        }

        /* Leaderboard Panel */
        .leaderboard-panel {
            width: 280px;
            border: 2px solid var(--neon-green);
            padding: 25px;
            box-shadow: 
                0 0 20px rgba(57, 255, 20, 0.3),
                inset 0 0 20px rgba(57, 255, 20, 0.05);
            min-height: 450px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .leaderboard-panel h2 {
            text-align: center;
            border-bottom: 2px solid var(--neon-green);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-green);
        }
        
        #high-scores-list {
            list-style: none;
            padding: 0;
        }

        #high-scores-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1rem;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            transition: all 0.3s;
        }

        #high-scores-list li:hover {
            border-bottom-color: var(--neon-green);
            padding-left: 5px;
        }

        .score-val {
            color: var(--neon-pink);
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .middle-row {
            display: flex;
            gap: 20px;
        }

        .control-btn {
            background: rgba(17, 17, 17, 0.9);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            touch-action: manipulation;
            transition: all 0.2s;
        }
        
        .control-btn:active {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px var(--neon-green);
            transform: scale(0.95);
        }

        /* Responsive Design */
        @media (max-width: 850px) {
            body {
                flex-direction: column;
                overflow-y: auto;
                padding: 20px 0;
                height: auto;
            }

            .container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }
            
            canvas {
                width: 100% !important;
                max-width: 400px;
                height: auto !important;
            }

            #game-wrapper {
                width: 100%;
                max-width: 410px;
            }
            
            #mobile-controls {
                display: flex;
            }

            .leaderboard-panel {
                width: 90%;
                max-width: 400px;
            }
            
            h1 {
                font-size: 2rem;
                letter-spacing: 4px;
            }

            .glitch-name {
                font-size: 2rem;
            }

            .stats-bar {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-text">
            <div class="glitch-label">SYSTEM ARCHITECT</div>
            <div class="glitch-name">ANUSHKA BHANDARI</div>
        </div>
    </div>

    <div class="scanlines"></div>

    <div class="container">
        <div class="game-area">
            <h1>NEON SNAKE</h1>

            <div class="stats-bar">
                <div>SCORE: <span id="score">0</span></div>
            </div>

            <div id="game-wrapper">
                <canvas id="gameCanvas" width="500" height="500"></canvas>
                
                <div id="ui-layer">
                    <h2 id="status-text">PRESS START</h2>
                    <button id="action-btn" class="action-btn">INITIATE SYSTEM</button>
                    <div class="controls-hint">PC: ARROW KEYS | MOBILE: TOUCH BUTTONS</div>
                </div>
            </div>

            <div id="mobile-controls">
                <button id="upBtn" class="control-btn">▲</button>
                <div class="middle-row">
                    <button id="leftBtn" class="control-btn">◀</button>
                    <button id="rightBtn" class="control-btn">▶</button>
                </div>
                <button id="downBtn" class="control-btn">▼</button>
            </div>
        </div>

        <div class="leaderboard-panel">
            <h2>TOP AGENTS</h2>
            <ul id="high-scores-list">
                <li style="text-align:center; color: var(--neon-blue);">CONNECTING...</li>
            </ul>
        </div>
    </div>

    <script>
        /* --- CONFIGURATION --- */
        // Use localhost for local testing, production URL for deployment
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000/api/scores'
            : 'https://cyberpunk-glpv.onrender.com/api/scores';

        // --- INTRO LOGIC ---
        window.addEventListener('load', () => {
            const intro = document.getElementById('intro-overlay');
            setTimeout(() => {
                intro.style.opacity = '0';
                setTimeout(() => { intro.style.display = 'none'; }, 1000);
            }, 2500);
        });

        // --- GAME SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20;
        const TILE_COUNT = 25;
        const BASE_SPEED = 100;
        
        let snake = [];
        let food = {x: 0, y: 0};
        let velocity = {x: 0, y: 0};
        let score = 0;
        let gameLoopId;
        let isPaused = false;
        let isGameOver = true;
        let speed = BASE_SPEED;
        let particles = [];

        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const statusText = document.getElementById('status-text');
        const actionBtn = document.getElementById('action-btn');
        const scoreEl = document.getElementById('score');
        const leaderboardList = document.getElementById('high-scores-list');

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- BACKEND ---
        async function fetchLeaderboard() {
            try {
                leaderboardList.innerHTML = '<li style="color:yellow; text-align:center;">CONNECTING...</li>';
                const res = await fetch(API_URL, { 
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!res.ok) {
                    throw new Error(`Server responded with ${res.status}`);
                }
                
                const data = await res.json();
                console.log('Leaderboard data:', data);
                updateLeaderboardUI(data);
            } catch (err) {
                console.error("Backend Error:", err);
                leaderboardList.innerHTML = '<li style="color:red; text-align:center;">OFFLINE MODE</li>';
            }
        }

        function updateLeaderboardUI(scores) {
            leaderboardList.innerHTML = scores.length ? '' : '<li style="text-align:center;">NO DATA</li>';
            scores.forEach((s, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${index + 1}. ${s.name}</span> <span class="score-val">${s.score}</span>`;
                leaderboardList.appendChild(li);
            });
        }

        async function submitScore() {
            const name = prompt(`MISSION FAILED. SCORE: ${score}\nENTER AGENT ALIAS:`);
            if (name) {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, score })
                    });
                    
                    if (!res.ok) {
                        throw new Error(`Server error: ${res.status}`);
                    }
                    
                    console.log('Score saved successfully!');
                    fetchLeaderboard();
                } catch (err) { 
                    console.error('Submit error:', err);
                    alert("Save Failed! Backend might be sleeping."); 
                }
            }
            statusText.innerText = "CRITICAL FAILURE";
            actionBtn.innerText = "REBOOT SYSTEM";
            uiLayer.classList.remove('hidden');
        }

        // --- CORE GAME LOGIC ---
        function initGame() {
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            velocity = {x: 0, y: -1};
            score = 0;
            speed = BASE_SPEED;
            isGameOver = false;
            isPaused = false;
            particles = [];
            scoreEl.innerText = 0;
            placeFood();
            
            uiLayer.classList.add('hidden');
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(gameLoop, speed);
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameLoopId);
                statusText.innerText = "SYSTEM PAUSED";
                actionBtn.innerText = "RESUME";
                uiLayer.classList.remove('hidden');
            } else {
                gameLoopId = setInterval(gameLoop, speed);
                uiLayer.classList.add('hidden');
            }
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoopId);
            playSound('die');
            setTimeout(submitScore, 100);
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) placeFood();
            }
        }

        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x * GRID_SIZE + GRID_SIZE/2,
                    y: y * GRID_SIZE + GRID_SIZE/2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: `hsl(${Math.random()*60 + 300}, 100%, 60%)`
                });
            }
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver(); return;
            }
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOver(); return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                playSound('eat');
                createParticles(head.x, head.y);
                placeFood();
                if (score % 50 === 0 && speed > 50) {
                    clearInterval(gameLoopId);
                    speed -= 5;
                    gameLoopId = setInterval(gameLoop, speed);
                }
            } else {
                snake.pop();
            }

            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(57, 255, 20, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i*GRID_SIZE, 0);
                ctx.lineTo(i*GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i*GRID_SIZE);
                ctx.lineTo(canvas.width, i*GRID_SIZE);
                ctx.stroke();
            }

            // Food
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE-4, GRID_SIZE-4);
            ctx.shadowBlur = 0;

            // Snake
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#39ff14';
                } else {
                    ctx.fillStyle = '#39ff14';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#39ff14';
                }
                ctx.fillRect(part.x * GRID_SIZE + 2, part.y * GRID_SIZE + 2, GRID_SIZE-4, GRID_SIZE-4);
            });
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // --- INPUT HANDLING ---
        function handleInput(key) {
            if (isGameOver && (key === 'Enter' || key === 'ArrowUp')) { initGame(); return; }
            if (!isGameOver && key === ' ') { togglePause(); return; }

            switch(key) {
                case 'ArrowUp': if (velocity.y !== 1) velocity = {x: 0, y: -1}; break;
                case 'ArrowDown': if (velocity.y !== -1) velocity = {x: 0, y: 1}; break;
                case 'ArrowLeft': if (velocity.x !== 1) velocity = {x: -1, y: 0}; break;
                case 'ArrowRight': if (velocity.x !== -1) velocity = {x: 1, y: 0}; break;
            }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
            handleInput(e.key);
        });

        // Mobile Buttons
        const btns = {
            upBtn: 'ArrowUp', downBtn: 'ArrowDown', 
            leftBtn: 'ArrowLeft', rightBtn: 'ArrowRight'
        };
        
        Object.keys(btns).forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(btns[id]); });
            btn.addEventListener("click", () => handleInput(btns[id]));
        });

        actionBtn.addEventListener('click', () => {
            if (isGameOver) initGame(); else togglePause();
        });

        fetchLeaderboard();
    </script>
</body>
</html>
